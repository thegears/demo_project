[project]
name = "demo-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thegears", email = "semh.1362@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.1",
    "pyqt5>=5.15.11",
    "pyqtdarktheme>=2.1.0",
    "pyqtgraph>=0.14.0",
]

[project.scripts]
demo-project = "main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
